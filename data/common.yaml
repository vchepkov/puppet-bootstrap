---
lookup_options:
  bootstrap::maintenance::clean_dir:
    merge: unique
  bootstrap::mco::admins:
    merge: unique

bootstrap::maintenance::clean_dir:
  - "%{facts.puppet_vardir}/clientbucket"
  - "%{facts.puppet_vardir}/reports"

classes:
  - bootstrap::agent

puppet::client_package: openvox-agent
puppet::server_package: openvox-server

puppetdb::puppetdb_package: openvoxdb
puppetdb::master::config::terminus_package: openvoxdb-termini
puppetdb::master::puppetdb_conf::legacy_terminus: true
